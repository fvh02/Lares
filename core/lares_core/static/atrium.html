<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7" id="theme-color">
<script>
// design and mode before the first paint (no flash): the account's choice, remembered on this device
(() => {
  let a = {design: "klassisch", modus: "auto"};
  try { a = {...a, ...JSON.parse(localStorage.getItem("lares-darstellung") || "{}")}; } catch {}
  const dark = a.modus === "dunkel" || (a.modus === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.design = a.design;
  document.documentElement.dataset.dark = dark ? "1" : "0";
})();
</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lares Atrium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 14 16 5l12 9v13H4z' fill='%23a0522d'/%3E%3Cpath d='M12 27v-8h8v8' fill='%23f6f1e7'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f1e7;--panel:#fffdf8;--fg:#221d16;--muted:#6f6555;--line:#e2d8c6;--accent:#a0522d;--accent-fg:#fff;
  --ok:#2e7d4f;--warn:#b7791f;--bad:#b3261e;--shadow:0 1px 2px rgba(60,40,10,.06),0 4px 16px rgba(60,40,10,.06);
  --radius:14px;
}
:root[data-dark="1"]{
  --bg:#17140f;--panel:#211d17;--fg:#efe7da;--muted:#a89d8b;--line:#3a3328;--accent:#d98b5f;--accent-fg:#1b130c;
  --ok:#6cc08b;--warn:#e0b252;--bad:#ef7b72;--shadow:none;color-scheme:dark;
}
/* design "Himmel": the weather behind frosted glass */
:root[data-design="himmel"]{
  --bg:transparent;--panel:rgba(255,255,255,.56);--line:rgba(255,255,255,.6);--field:rgba(255,255,255,.5);
  --glass:blur(22px) saturate(170%);--shadow:0 8px 30px rgba(18,30,60,.14);--muted:#4f4a42;
}
:root[data-design="himmel"][data-dark="1"]{
  --panel:rgba(18,20,28,.5);--line:rgba(255,255,255,.12);--field:rgba(0,0,0,.25);--shadow:0 8px 30px rgba(0,0,0,.3);
  --muted:#b9b1a3;
}
:root[data-design="himmel"]{background:#6f8fb8}
:root[data-design="himmel"][data-dark="1"]{background:#10131c}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
[data-design="himmel"] body{background:transparent}
[data-design="himmel"] header{background:rgba(255,255,255,.3);border-bottom-color:rgba(255,255,255,.35)}
[data-design="himmel"][data-dark="1"] header{background:rgba(14,16,24,.38);border-bottom-color:rgba(255,255,255,.08)}
[data-design="himmel"] :is(header,.card,.tile,.rtile,.menu,dialog,.tabs,.banner,.empty,.weather){-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
[data-design="himmel"] :is(input,select,textarea){background:var(--field)}
[data-design="himmel"] .empty{background:var(--panel)}
/* menus sit inside glass tiles, where the blur cannot reach the neighbours: almost solid glass instead */
[data-design="himmel"] .menu{background:rgba(255,255,255,.97)}
[data-design="himmel"][data-dark="1"] .menu{background:rgba(26,28,36,.97)}
[data-design="himmel"] nav a.on{background:var(--panel)}
[data-design="himmel"] dialog::backdrop{background:rgba(10,14,24,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
/* text that stands right on the sky follows its brightness */
[data-design="himmel"][data-sky="dunkel"]:not([data-dark="1"]) :is(main>h1,main>h2,main>p.lead,.auth>h1,.auth>p.lead,.or,header .brand,header nav a:not(.on)){color:#f6f2ea;text-shadow:0 1px 8px rgba(0,0,0,.35)}
[data-design="himmel"][data-dark="1"] :is(main>h1,main>p.lead,.auth>h1){text-shadow:0 1px 10px rgba(0,0,0,.45)}
.weather{position:fixed;left:16px;bottom:16px;z-index:4;font-size:13px;padding:6px 12px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--fg)}
.weather[hidden]{display:none}
/* design picker */
.designs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.design{border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;background:var(--panel);text-align:left;cursor:pointer}
.design.on{border-color:var(--accent)}
.design .pv{height:92px;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px}
.design .pv i{border-radius:8px;display:block}
.design b{display:block;padding:8px 12px 10px;font-weight:600;font-size:14px}
.pv.klassisch{background:#f6f1e7}.pv.klassisch i{background:#fffdf8;border:1px solid #e2d8c6}
.pv.himmel{background:linear-gradient(#3f80d4,#f3d6b8)}.pv.himmel i{background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7)}
.seg{display:inline-flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:.02em;display:flex;align-items:center;gap:8px;text-decoration:none;color:inherit}
.brand svg{width:22px;height:22px}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:15px}
nav a.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
main{max-width:960px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:26px;font-weight:650;margin:0 0 4px}
h2{font-size:18px;font-weight:620;margin:28px 0 10px}
p.lead{color:var(--muted);margin:0 0 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;min-height:120px;padding:16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:inherit;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:var(--accent-fg);background:var(--accent)}
.tile b{font-weight:620}.tile small{color:var(--muted);font-size:13px;line-height:1.35}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1 1 200px;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{color:var(--ok);border-color:currentColor}.pill.bad{color:var(--bad);border-color:currentColor}.pill.warn{color:var(--warn);border-color:currentColor}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:180px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
input[type=checkbox]{width:auto;margin-right:8px;accent-color:var(--accent)}
.check{display:flex;align-items:center;color:var(--fg);font-size:15px;margin:12px 0 4px}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}
  #me{order:2;margin-left:auto}
  nav{order:3;margin-left:0;width:calc(100% + 32px);margin:0 -16px;padding:0 16px 2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}nav a{white-space:nowrap}}
.auth{max-width:380px;margin:8vh auto 0}
.msg{margin:10px 0 0;font-size:14px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
pre.log{max-height:320px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--accent);margin-top:8px}
ul.rights{margin:8px 0 0;padding-left:20px}
.empty{padding:32px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius)}
/* avatar and menus */
.avatar{margin-left:8px;width:36px;height:36px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--accent-fg);font-weight:650;font-size:14px;cursor:pointer}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;z-index:20}
.menu[hidden]{display:none}
.menu .who{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block}
.menu button,.menu a{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-size:15px}
.menu button:hover,.menu a:hover{background:var(--bg)}
.menu .danger{color:var(--bad)}
/* room tiles in the administration */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.rtile{position:relative;display:flex;align-items:center;gap:12px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.rtile .ic{width:36px;height:36px;flex:none;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--accent-fg);background:var(--accent)}
.rtile.off .ic{background:var(--line);color:var(--muted)}
.rtile .txt{flex:1;min-width:0}.rtile .txt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtile .txt span{font-size:12px;color:var(--muted)}
/* an open menu lifts its tile above the neighbours (glass gives every tile its own layer) */
.rtile:has(>.menu-wrap>.menu:not([hidden])){z-index:30}
.dots{border:0;background:none;font-size:20px;line-height:1;padding:6px 8px;border-radius:8px;color:var(--muted)}
.dots:hover{background:var(--bg)}
.rtile.add{justify-content:center;border-style:dashed;background:none;box-shadow:none;color:var(--accent);cursor:pointer;font:inherit;min-height:62px}
.rtile.add .plus{font-size:22px;line-height:1}
/* dialogs */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--fg);padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(20,14,6,.45)}
dialog .dhead{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog .dhead b{flex:1;font-size:17px}
dialog .dbody{padding:16px;overflow:auto;max-height:calc(100vh - 140px)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;padding:7px 6px;border-radius:7px;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--fg);box-shadow:var(--shadow)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
/* login */
.alt{display:grid;gap:8px;margin-top:12px}
.alt button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.alt .apple{background:#000;color:#fff;border-color:#000}
[data-dark="1"] .alt .apple{background:#fff;color:#000;border-color:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.banner{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 40%,transparent);color:var(--fg);border-radius:12px;padding:10px 14px;margin:0 0 16px}
.list-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
</style>
</head>
<body>
<header id="head" hidden>
  <div class="bar">
    <a class="brand" href="#start"><svg viewBox="0 0 32 32"><path d="M4 14 16 5l12 9v13H4z" fill="var(--accent)"/><path d="M12 27v-8h8v8" fill="var(--bg)"/></svg>Lares</a>
    <nav id="nav"></nav>
    <div class="menu-wrap" id="me"></div>
  </div>
</header>
<main id="main"></main>
<div class="weather" id="weather" hidden></div>
<script src="/atrium/static/sky.js"></script>
<script>
"use strict";
const $main = document.getElementById("main");
let me = null;

// -- small helpers --------------------------------------------------------------------------------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
async function call(method, path, body) {
  const res = await fetch(path, {method, credentials: "same-origin",
    headers: body !== undefined ? {"Content-Type": "application/json"} : {},
    body: body !== undefined ? JSON.stringify(body) : undefined});
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (res.status === 401 && me && !path.startsWith("/atrium/anmelden")) { me = null; route(); }
  if (!res.ok) { const err = new Error((data && data.fehler) || `Fehler ${res.status}`); err.status = res.status; err.data = data; throw err; }
  return data;
}
const api = (m, p, b) => call(m, "/api/v1/admin" + p, b);
function msg(el, text, ok) { el.textContent = text || ""; el.className = "msg " + (ok ? "ok" : "bad"); }
function busy(btn, work) {
  return async (ev) => { ev && ev.preventDefault(); btn.disabled = true; try { await work(); } finally { btn.disabled = false; } };
}
function field(label, input) { return h("div", {}, h("label", {}, label), input); }
function pill(text, kind) { return h("span", {class: "pill " + (kind || "")}, text); }
function initials(name) { return name.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(); }

// -- routing --------------------------------------------------------------------------------------
const PAGES = {
  start: {title: "Start", render: pageStart},
  rooms: {title: "Rooms", render: pageRooms, admin: true},
  schluessel: {title: "Schlüssel", render: pageKeys, admin: true},
  system: {title: "System", render: pageSystem, admin: true},
  fernzugriff: {title: "Fernzugriff", render: pageRemote, admin: true},
  konten: {title: "Konten", render: pageAccounts, admin: true},
  konto: {title: "Mein Konto", render: pageMe, hidden: true},
};
// -- appearance: design and light/dark --------------------------------------------------------------
let look = {design: "klassisch", modus: "auto"};
try { look = {...look, ...JSON.parse(localStorage.getItem("lares-darstellung") || "{}")}; } catch {}
const darkMedia = matchMedia("(prefers-color-scheme: dark)");
function applyLook(next) {
  look = {...look, ...(next || {})};
  try { localStorage.setItem("lares-darstellung", JSON.stringify(look)); } catch {}
  const root = document.documentElement;
  const dark = look.modus === "dunkel" || (look.modus === "auto" && darkMedia.matches);
  root.dataset.design = look.design;
  root.dataset.dark = dark ? "1" : "0";
  document.getElementById("theme-color").content = dark ? "#17140f" : look.design === "himmel" ? "#6f8fb8" : "#f6f1e7";
  if (look.design === "himmel") window.LaresSky.on(); else { window.LaresSky.off(); document.getElementById("weather").hidden = true; }
  window.LaresSky.redraw();
}
darkMedia.addEventListener("change", () => applyLook());
document.addEventListener("lares-wetter", (e) => {
  const w = e.detail, box = document.getElementById("weather");
  if (look.design !== "himmel" || !w.text) return;
  box.textContent = `${w.temperatur != null ? Math.round(w.temperatur) + "° · " : ""}${w.text}${w.quelle === "wohnort" ? " · Zuhause" : ""}`;
  box.hidden = false;
});
applyLook();

const ERROR = new URLSearchParams(location.search).get("fehler");
if (ERROR) history.replaceState(null, "", "/" + location.hash);
let shownError = ERROR;

// one menu open at a time; closes on a click elsewhere or Escape
let openMenu = null;
function closeMenu() { if (openMenu) { openMenu.hidden = true; openMenu = null; } }
document.addEventListener("click", (e) => { if (openMenu && !openMenu.parentElement.contains(e.target)) closeMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });
function menu(button, items) {
  const box = h("div", {class: "menu", hidden: true, role: "menu"}, items.filter(Boolean).map(it =>
    it.nodeType ? it : h("button", {class: it.danger ? "danger" : "", role: "menuitem",
      onclick: (e) => { e.stopPropagation(); closeMenu(); it.run(); }}, it.label)));
  button.setAttribute("aria-haspopup", "menu");
  button.addEventListener("click", (e) => {
    e.stopPropagation();
    const was = openMenu === box; closeMenu();
    if (!was) { box.hidden = false; openMenu = box; }
  });
  return h("div", {class: "menu-wrap"}, button, box);
}
function dialog(title, ...body) {
  const d = h("dialog", {}, h("div", {class: "dhead"}, h("b", {}, title), h("button", {class: "dots", "aria-label": "Schließen", onclick: () => d.close()}, "×")),
    h("div", {class: "dbody"}, body));
  d.addEventListener("close", () => d.remove());
  document.body.append(d); d.showModal();
  return d;
}
function errorBanner() {
  if (!shownError) return null;
  const text = shownError; shownError = null;
  return h("div", {class: "banner"}, text);
}
async function route() {
  if (!me) {
    const st = await call("GET", "/atrium/zustand");
    me = st.konto;
    if (st.darstellung) applyLook(st.darstellung);
    if (!st.eingerichtet) return pageSetup();
    if (!me) return pageLogin(st.anbieter || []);
  }
  let name = location.hash.slice(1) || "start";
  if (!PAGES[name] || (PAGES[name].admin && me.rolle !== "admin")) name = "start";
  document.getElementById("head").hidden = false;
  const nav = document.getElementById("nav");
  const entries = Object.entries(PAGES).filter(([, p]) => !p.hidden && (!p.admin || me.rolle === "admin"));
  nav.replaceChildren(...(entries.length > 1 ? entries.map(([k, p]) => h("a", {href: "#" + k, class: k === name ? "on" : ""}, p.title)) : []));
  const avatar = h("button", {class: "avatar", title: me.name, "aria-label": "Konto"}, initials(me.name));
  document.getElementById("me").replaceChildren(menu(avatar, [
    h("div", {class: "who"}, h("b", {}, me.name), h("span", {class: "small muted"}, me.rolle === "admin" ? "Admin" : "Bewohner")),
    {label: "Mein Konto", run: () => { location.hash = "konto"; }},
    {label: "Abmelden", danger: true, run: async () => { await call("POST", "/atrium/abmelden"); me = null; location.hash = ""; route(); }},
  ]));
  document.title = PAGES[name].title + " · Lares";
  $main.replaceChildren(h("p", {class: "muted"}, "Lädt …"));
  const banner = errorBanner();
  try { await PAGES[name].render(); if (banner) $main.prepend(banner); }
  catch (err) { $main.replaceChildren(h("div", {class: "card"}, h("p", {class: "msg bad"}, err.message))); }
}
window.addEventListener("hashchange", route);

function afterLogin() {
  const next = new URLSearchParams(location.search).get("weiter");
  if (next && next.startsWith("/r/")) { location.href = next; return; }
  history.replaceState(null, "", "/" + location.hash);
  me = null; route();
}

// -- login and setup ------------------------------------------------------------------------------
function pageSetup() {
  document.getElementById("head").hidden = true;
  const code = h("input", {autocomplete: "one-time-code", placeholder: "ABCD-EF12-3456"});
  const name = h("input", {autocomplete: "username"});
  const pw = h("input", {type: "password", autocomplete: "new-password"});
  const out = h("p", {class: "msg"});
  const btn = h("button", {class: "primary"}, "Einrichten");
  const form = h("form", {class: "card"}, field("Einrichtungscode", code),
    h("p", {class: "small muted"}, "Er steht im Log von Lares Core und in /data/core/setup.code."),
    field("Dein Name", name), field("Passwort (mindestens 10 Zeichen)", pw), h("div", {class: "actions"}, btn), out);
  form.addEventListener("submit", busy(btn, async () => {

async function roomSettings(r) {

  }));
  const releases = Object.entries(r.freigaben);

  $main.replaceChildren(h("h1", {}, "Fernzugriff"), h("p", {class: "lead"}, "Tailscale für deine Geräte, Cloudflare Tunnel für Rooms im Internet."),
    h("div", {class: "card"}, h("div", {class: "row"}, h("h2", {class: "grow", style: "margin:0"}, "Tailscale"), state(ts)),
      h("p", {class: "small muted"}, "Privat: nur deine Geräte im Tailnet. Lares ist dann unter https://", ts.hostname, ".<tailnet>.ts.net erreichbar."),
      ts.anmelden ? h("p", {}, h("a", {href: ts.anmelden, target: "_blank", rel: "noopener"}, "Jetzt bei Tailscale anmelden →")) : null,
      !ts.schluessel ? h("p", {class: "small muted"}, "Ohne Schlüssel tailscale_authkey erscheint nach dem Einschalten hier ein Anmelde-Link.") : null,
      h("label", {class: "check"}, tsOn, "Eingeschaltet"), field("Gerätename", tsHost), field("Heimnetz von unterwegs (Routen)", tsRoutes),
      h("label", {class: "check"}, tsExit, "Als Exit-Node anbieten"), h("div", {class: "actions"}, tsSave), tsOut),
    h("div", {class: "card"}, h("div", {class: "row"}, h("h2", {class: "grow", style: "margin:0"}, "Cloudflare Tunnel"), state(cf)),
      h("p", {class: "small muted"}, "Internet: nur freigegebene Rooms. Im Cloudflare-Dashboard jede Adresse auf ", h("code", {}, cf.ziel), " zeigen lassen."),
      !cf.schluessel ? h("p", {class: "msg bad"}, "Schlüssel cloudflare_tunnel_token fehlt – unter „Schlüssel“ eintragen.") : null,
      h("label", {class: "check"}, cfOn, "Eingeschaltet"), h("div", {class: "actions"}, cfSave), cfOut,
      h("h2", {}, "Freigegebene Rooms"), releases.length ? h("ul", {}, releases.map(([id, f]) => h("li", {}, id, f.host ? ` – ${f.host}` : "", f.zugangscode ? " (mit Zugangscode)" : "")))
        : h("p", {class: "small muted"}, "Keine – unter „Rooms“ → „Internet“ freigeben.")));
}

// -- accounts -------------------------------------------------------------------------------------
async function pageAccounts() {
  const list = await api("GET", "/konten");
  const rows = list.map(a => {
    const role = h("select", {}, ["admin", "bewohner"].map(x => h("option", {value: x, selected: x === a.rolle}, x === "admin" ? "Admin" : "Bewohner")));
    const out = h("p", {class: "msg"});
    role.addEventListener("change", async () => { try { await api("PUT", `/konten/${encodeURIComponent(a.name)}`, {rolle: role.value}); msg(out, "Gespeichert.", true); } catch (err) { msg(out, err.message); role.value = a.rolle; } });
    const reset = h("button", {}, "Neues Passwort");
    reset.addEventListener("click", busy(reset, async () => {
      const pw = prompt(`Neues Passwort für ${a.name} (mindestens 10 Zeichen):`);
      if (!pw) return;
      try { await api("PUT", `/konten/${encodeURIComponent(a.name)}`, {passwort: pw}); msg(out, "Passwort gesetzt, Sitzungen beendet.", true); } catch (err) { msg(out, err.message); }
    }));
    const del = a.name === me.name ? null : h("button", {class: "danger"}, "Löschen");
    if (del) del.addEventListener("click", busy(del, async () => { if (confirm(`${a.name} löschen?`)) { try { await api("DELETE", `/konten/${encodeURIComponent(a.name)}`); route(); } catch (err) { msg(out, err.message); } } }));
    return h("div", {class: "card"}, h("div", {class: "row"}, h("b", {class: "grow"}, a.name), a.zwei_faktor ? pill("2FA", "ok") : null, role, reset, del), out);
  });
  const name = h("input"), pw = h("input", {type: "password", autocomplete: "new-password"});
  const role = h("select", {}, h("option", {value: "bewohner"}, "Bewohner"), h("option", {value: "admin"}, "Admin"));
  const out = h("p", {class: "msg"});
  const add = h("button", {class: "primary"}, "Anlegen");
  add.addEventListener("click", busy(add, async () => { try { await api("POST", "/konten", {name: name.value, passwort: pw.value, rolle: role.value}); route(); } catch (err) { msg(out, err.message); } }));
  const providers = await api("GET", "/anmeldung");
  const providerCard = h("div", {class: "card"}, h("h2", {style: "margin-top:0"}, "Anmeldung mit Apple und Google"),
    h("p", {class: "small muted"}, "Die Schlüssel kommen unter „Schlüssel“ in den Tresor. Als Rücksprung-Adresse beim Anbieter eintragen (nur HTTPS):"),
    Object.entries(providers).map(([p, c]) => h("div", {class: "list-row"}, h("div", {style: "flex:1;min-width:0"}, h("b", {}, c.name),
      h("div", {class: "small muted", style: "word-break:break-all"}, `${location.origin.replace(/^http:/, "https:")}/atrium/anmelden/${p}/zurueck`),
      c.fehlt.length ? h("div", {class: "small muted"}, "Fehlt: " + c.fehlt.join(", ")) : null), c.eingerichtet ? pill("eingerichtet", "ok") : pill("fehlt", "warn"))));
  $main.replaceChildren(h("h1", {}, "Konten"), h("p", {class: "lead"}, "Admins verwalten das System, Bewohner öffnen die Rooms."), h("div", {}, rows),
    h("h2", {}, "Neues Konto"), h("div", {class: "card"}, h("div", {class: "grid2"}, h("div", {}, field("Name", name)), h("div", {}, field("Passwort", pw))),
      field("Rolle", role), h("div", {class: "actions"}, add), out), providerCard);
}

// -- my account -----------------------------------------------------------------------------------
async function pageMe() {
  const tf = await call("GET", "/atrium/zwei-faktor");
  const old = h("input", {type: "password", autocomplete: "current-password"}), neu = h("input", {type: "password", autocomplete: "new-password"});
  const pwOut = h("p", {class: "msg"});
  const pwSave = h("button", {class: "primary"}, "Passwort ändern");
  pwSave.addEventListener("click", busy(pwSave, async () => { try { await call("POST", "/atrium/passwort", {alt: old.value, neu: neu.value}); old.value = neu.value = ""; msg(pwOut, "Geändert.", true); } catch (err) { msg(pwOut, err.message); } }));

  const tfBox = h("div");
  const tfOut = h("p", {class: "msg"});
  if (tf.aktiv) {
    const pw = h("input", {type: "password", autocomplete: "current-password"});
    const off = h("button", {class: "danger"}, "Zwei-Faktor ausschalten");
    off.addEventListener("click", busy(off, async () => { try { await call("POST", "/atrium/zwei-faktor/aus", {passwort: pw.value}); route(); } catch (err) { msg(tfOut, err.message); } }));
    tfBox.append(h("p", {}, pill("eingeschaltet", "ok")), field("Passwort zum Ausschalten", pw), h("div", {class: "actions"}, off));
  } else {
    const start = h("button", {class: "primary"}, "Zwei-Faktor einrichten");
    start.addEventListener("click", busy(start, async () => {
      const s = await call("POST", "/atrium/zwei-faktor/start");
      const code = h("input", {inputmode: "numeric", autocomplete: "one-time-code", placeholder: "123456"});
      const ok = h("button", {class: "primary"}, "Bestätigen");
      ok.addEventListener("click", busy(ok, async () => { try { await call("POST", "/atrium/zwei-faktor/bestaetigen", {code: code.value}); route(); } catch (err) { msg(tfOut, err.message); } }));
      tfBox.replaceChildren(h("p", {}, "Auf dem iPhone den Link öffnen (Passwörter-App) oder das Geheimnis in einer Authenticator-App eintragen:"),
        h("p", {}, h("a", {href: s.link}, "In Authenticator-App öffnen →")), h("p", {class: "small"}, h("code", {}, s.geheimnis)),
        field("Code aus der App", code), h("div", {class: "actions"}, ok));
    }));
    tfBox.append(h("p", {class: "small muted"}, "Beim Anmelden wird zusätzlich ein Code aus der App abgefragt."), h("div", {class: "actions"}, start));
  }
  // passkeys
  const keys = await call("GET", "/atrium/passkeys");
  const pkOut = h("p", {class: "msg"});
  const pkList = h("div", {}, keys.length ? keys.map(k => {
    const del = h("button", {class: "danger"}, "Entfernen");
    del.addEventListener("click", busy(del, async () => { if (confirm(`Passkey „${k.name}“ entfernen?`)) { await call("DELETE", `/atrium/passkeys/${encodeURIComponent(k.id)}`); route(); } }));
    return h("div", {class: "list-row"}, h("div", {class: "grow", style: "flex:1"}, h("b", {}, k.name), h("div", {class: "small muted"},
      "angelegt " + new Date(k.erstellt * 1000).toLocaleDateString("de-DE") + (k.zuletzt ? " · zuletzt " + new Date(k.zuletzt * 1000).toLocaleDateString("de-DE") : ""))), del);
  }) : h("p", {class: "small muted"}, "Noch keine Passkeys."));
  const pkAdd = h("button", {class: "primary", disabled: !PASSKEYS}, "Passkey hinzufügen");
  pkAdd.addEventListener("click", busy(pkAdd, async () => {
    try {
      const start = await call("POST", "/atrium/passkey/neu/start");
      const o = start.optionen;
      const cred = await navigator.credentials.create({publicKey: {...o, challenge: unb64u(o.challenge),
        user: {...o.user, id: unb64u(o.user.id)}, excludeCredentials: o.excludeCredentials.map(c => ({...c, id: unb64u(c.id)}))}});
      const label = /iPhone|iPad/.test(navigator.userAgent) ? "iPhone" : /Mac/.test(navigator.userAgent) ? "Mac" : /Android/.test(navigator.userAgent) ? "Android" : "Passkey";
      await call("POST", "/atrium/passkey/neu", {vorgang: start.vorgang, credential: credentialJSON(cred), name: label});
      route();
    } catch (err) { msg(pkOut, err.name === "NotAllowedError" ? "Abgebrochen." : err.name === "InvalidStateError" ? "Dieses Gerät hat schon einen Passkey für Lares." : err.message); }
  }));

  // Apple and Google
  const links = await call("GET", "/atrium/verknuepfungen");
  const linkRows = Object.entries(links).map(([p, l]) => {
    let action;
    if (l.verbunden) {
      action = h("button", {class: "danger"}, "Trennen");
      action.addEventListener("click", busy(action, async () => { await call("DELETE", `/atrium/verknuepfungen/${p}`); route(); }));
    } else {
      action = h("button", {disabled: !l.eingerichtet}, "Verbinden");
      action.addEventListener("click", () => { location.href = `/atrium/anmelden/${p}?modus=verbinden`; });
    }
    return h("div", {class: "list-row"}, h("div", {style: "flex:1"}, h("b", {}, l.name),
      h("div", {class: "small muted"}, l.verbunden ? (l.verbunden.email || "verbunden") : l.eingerichtet ? "nicht verbunden" : "vom Admin noch nicht eingerichtet")), action);
  });

  // appearance
  const lookOut = h("p", {class: "msg"});
  const saveLook = async (change) => {
    applyLook(change);
    try { await call("PUT", "/atrium/darstellung", change); msg(lookOut, ""); } catch (err) { msg(lookOut, err.message); }
    renderLook();
  };
  const lookBox = h("div");
  const DESIGNS = [["klassisch", "Klassisch", "Warm und ruhig, wie bisher."], ["himmel", "Himmel", "Das Wetter an deinem Ort im Hintergrund, Milchglas davor – mit Sonnenauf- und -untergang zur echten Zeit."]];
  function renderLook() {
    lookBox.replaceChildren(
      h("div", {class: "designs"}, DESIGNS.map(([id, name, text]) => h("button", {class: "design" + (look.design === id ? " on" : ""), "aria-pressed": look.design === id ? "true" : "false",
        onclick: () => saveLook({design: id})}, h("div", {class: "pv " + id}, h("i"), h("i"), h("i"), h("i")), h("b", {}, name),
        h("span", {class: "small muted", style: "display:block;padding:0 12px 12px;margin-top:-6px"}, text)))),
      h("label", {}, "Hell oder dunkel"),
      h("div", {class: "seg"}, [["auto", "Automatisch"], ["hell", "Hell"], ["dunkel", "Dunkel"]].map(([id, name]) =>
        h("button", {class: look.modus === id ? "on" : "", onclick: () => saveLook({modus: id})}, name))));
  }
  renderLook();

  $main.replaceChildren(h("h1", {}, me.name), h("p", {class: "lead"}, me.rolle === "admin" ? "Admin" : "Bewohner"),
    h("div", {class: "card"}, h("h2", {style: "margin-top:0"}, "Darstellung"), lookBox, lookOut),
    h("div", {class: "card"}, h("h2", {style: "margin-top:0"}, "Passkeys"),
      h("p", {class: "small muted"}, "Anmelden mit Face ID, Touch ID oder der Geräte-PIN – ohne Passwort. Geht nur über die HTTPS-Adresse (Tailscale)."),
      pkList, h("div", {class: "actions"}, pkAdd), PASSKEYS ? null : h("p", {class: "small muted"}, "Auf dieser Adresse nicht möglich – bitte über https öffnen."), pkOut),
    h("div", {class: "card"}, h("h2", {style: "margin-top:0"}, "Apple und Google"),
      h("p", {class: "small muted"}, "Verbundene Konten können sich ohne Passwort anmelden."), linkRows),
    h("div", {class: "card"}, h("h2", {style: "margin-top:0"}, "Passwort"), field("Bisheriges Passwort", old), field("Neues Passwort", neu), h("div", {class: "actions"}, pwSave), pwOut),
    h("div", {class: "card"}, h("h2", {style: "margin-top:0"}, "Zwei-Faktor-Anmeldung"), tfBox, tfOut));
}

route();
</script>
