# Lares OS – Debian 13 (trixie), bootable from a USB stick (UEFI, x86-64).
# Build: ./build.sh  (needs root and mkosi; see README.md)

[Distribution]
# Debian by default; Ubuntu only to test the image where Debian's mirrors are not reachable
Distribution=debian
Architecture=x86-64

[Output]
Format=disk
ImageId=lares-os
Output=lares-os

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=quiet loglevel=3 systemd.show_status=auto console=ttyS0,115200 console=tty0
Hostname=lares
Locale=de_DE.UTF-8
Keymap=de
Timezone=Europe/Berlin
WithDocs=no
CleanPackageMetadata=yes
ExtraTrees=../core/lares_core:/opt/lares/lares_core
# The initrd only needs what it takes to find the system: USB sticks, NVMe, SATA, SD cards (the rest loads later)
KernelModulesInitrdExclude=.*
KernelModulesInitrdInclude=default
        /usb/storage/
        /usb/host/
        /nvme/
        /ata/
        /scsi/
        /mmc/
        /virtio
Packages=
        systemd
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        udev
        dbus
        kmod
        iproute2
        iputils-ping
        ca-certificates
        curl
        nano
        less
        locales
        keyboard-configuration
        tzdata
        avahi-daemon
        libnss-mdns
        e2fsprogs
        dosfstools
        fdisk
        util-linux
        rsync
        docker.io
        python3
        python3-aiohttp
        python3-yaml
        python3-cryptography
