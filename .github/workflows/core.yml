name: Lares Core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r core/requirements.txt pyflakes
      - name: Pebble (Let's Encrypt test server) for the HTTPS test
        run: |
          mkdir -p "$RUNNER_TEMP/pebble"
          for tool in pebble pebble-challtestsrv; do
            curl -sSL "https://github.com/letsencrypt/pebble/releases/download/v2.7.0/$tool-linux-amd64.tar.gz" \
              | tar -xz -C "$RUNNER_TEMP/pebble" --strip-components=3 "$tool-linux-amd64/linux/amd64/$tool"
          done
          echo "LARES_PEBBLE_DIR=$RUNNER_TEMP/pebble" >> "$GITHUB_ENV"
      - run: python -m pyflakes core sdk examples
      - run: python -m unittest discover -s tests -v
        working-directory: core
        env:
          PYTHONPATH: .

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f core/Dockerfile -t lares-core:test .
      - run: docker build -f examples/hallo/Dockerfile -t lares-hallo:test .
